  <div id="s2-t3" class="t-sub"><span class="w s2-w3" >More </span><span class="w s2-w3" >complexity </span><span class="w s2-w3" >than </span><span class="w s2-w3" >meets </span><span class="w s2-w3" >the </span><span class="w s2-w3" >eye.</span></div>
</div>

<svg id="s2-cur" class="cursor" viewBox="0 0 64 64">
  <path d="M10 6 L10 50 L21 39 L29 57 L37 53.5 L29 36 L45 36 Z" fill="#2B2A28" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
</svg>

</div>
<script>
(function () {

gsap.config({force3D:false});
const $ = (s) => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const sm = (t) => { t = clamp(t,0,1); return t*t*(3-2*t); };
const eio = (t) => { t = clamp(t,0,1); return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; };
const eout = (t) => { t = clamp(t,0,1); return 1-Math.pow(1-t,3); };
// keyed values: keys = [[t, v], ...] eased in-out between keys
const key = (t, keys, ease = eio) => {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [t0,v0] = keys[i-1], [t1,v1] = keys[i]; return lerp(v0, v1, ease((t-t0)/(t1-t0))); }
  }
  return keys[keys.length-1][1];
};
const rot = (id, a, cx, cy) => { const e = document.getElementById(id); if (e) e.setAttribute('transform', 'rotate(' + a.toFixed(3) + ' ' + cx + ' ' + cy + ')'); };
const setT = (id, s) => { const e = document.getElementById(id); if (e) e.setAttribute('transform', s); };
const setO = (id, o) => { const e = document.getElementById(id); if (e) e.setAttribute('opacity', o); };
// camera: put world point (cx,cy) at screen (sx,sy) with scale s
const camTo = (s, cx, cy, sx = 960, sy = 540) => ({ scale: s, x: sx - cx*s, y: sy - cy*s });
// per-word blur reveal
const revealWords = (tl, sel, t, gap = 0.08, dur = 0.5) => {
  tl.fromTo(sel, { opacity: 0, filter: 'blur(10px)', y: 14 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: dur, ease: 'expo.out', stagger: gap }, t);
};
const hideWords = (tl, sel, t, gap = 0.04) => {
  tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: 0.22, ease: 'power2.in', stagger: gap }, t);
};
// a clock that calls fn(t) for every frame of the scene, deterministic under seeking
const drive = (tl, dur, fn) => { const c = { t: 0 }; tl.fromTo(c, { t: 0 }, { t: dur, duration: dur, ease: 'none', onUpdate: () => fn(c.t) }, 0); fn(0); };
// number counter
const countTo = (tl, sel, from, to, t, dur, fmt) => { const o = { v: from }; tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: 'power2.out', onUpdate: () => { const e = $(sel); if (e) e.textContent = fmt(o.v); } }, t); };
const money = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const tl = gsap.timeline({ paused: true });


const poseBack = (o) => {
  const sit = o.sit ?? 0;
  setT('s2-mb', 'translate(' + o.x.toFixed(2) + ' 798)');
  setO('s2-mb', o.op ?? 1);
  setT('s2-mb-up', 'translate(0 ' + (44*sit + (o.bob ?? 0)).toFixed(2) + ') rotate(' + (o.lean ?? 0) + ' 0 -165)');
  setT('s2-mb-legs', 'translate(0 ' + (40*sit).toFixed(2) + ') scale(1 ' + (1 - 0.55*sit).toFixed(3) + ')');
  setO('s2-mb-legs', 1 - sit*0.98);
  rot('s2-mb-armL', o.armL ?? 4, -24, -252);
  rot('s2-mb-foreL', o.foreL ?? 0, -24.5, -200);
  rot('s2-mb-armR', o.armR ?? -4, 24, -252);
  rot('s2-mb-foreR', o.foreR ?? 0, 24.5, -200);
  setO('s2-mb-cup', o.cup ?? 0);
  setO('s2-mb-cupL', o.cupL ?? 0);
  setT('s2-mb-head', 'rotate(' + (o.head ?? 0).toFixed(2) + ' 0 -280) translate(' + (o.headX ?? 0) + ' 0)');
};

const world = document.getElementById('s2-world');
const cam = (s, cx, cy, sx = 960, sy = 540) => { cx = clamp(cx, sx / s, 1920 - (1920 - sx) / s); cy = clamp(cy, sy / s, 1080 - (1080 - sy) / s); world.style.transform = 'translate(' + (sx - cx * s).toFixed(2) + 'px,' + (sy - cy * s).toFixed(2) + 'px) scale(' + s.toFixed(4) + ')'; };
// seated, typing pose
const seated = (t, extra = {}) => poseBack(Object.assign({ x: 1095, op: 1, sit: 1, armR: -12, foreR: -18, armL: 10, foreL: 14, head: 4 + 1.2 * Math.sin(t * 0.9) }, extra));

drive(tl, 8, (t) => {
  seated(t, { head: 4 + 1.2 * Math.sin(t * 0.9) + key(t, [[1.0, 0], [1.3, 2.5], [2.2, 2.5], [2.6, 0]]) });
  const s = key(t, [[0, 3.25], [1.05, 6.0], [3.15, 6.0], [3.7, 11]], (u) => eio(u));
  const cx = key(t, [[0, 1234], [1.05, 1291], [3.15, 1291], [3.7, 1333]]);
  const cy = key(t, [[0, 538], [1.05, 520], [3.15, 520], [3.7, 500]]);
  cam(s, cx, cy);
});
// payment lands on the dashboard
tl.fromTo('#s2-toast', { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, 1.0);
tl.fromTo('#s2-row', { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, 1.25);
tl.fromTo('#s2-rcard', { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, 1.85);
// Maya opens the remittance
tl.fromTo('#s2-cur', { x: 1500, y: 1100, opacity: 1 }, { x: 1370, y: 380, duration: 0.7, ease: 'power3.out' }, 2.35);
tl.to('#s2-cur', { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: '10px 6px' }, 3.05);
tl.to('#s2-cur', { opacity: 0, duration: 0.15 }, 3.3);
// the card becomes the document (screen-space handoff)
tl.fromTo('#s2-pw', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.inOut' }, 3.35);
tl.fromTo('#s2-world', { opacity: 1 }, { opacity: 0, duration: 0.05 }, 3.66);
tl.fromTo('#s2-pdf', { x: 1210 - 700, y: 309 - 150, scaleX: 0.8, scaleY: 0.22 }, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.75, ease: 'expo.out' }, 3.35);
tl.fromTo('.s2-prow, .s2-pbar', { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.025 }, 3.7);
// three sources, fragmented
tl.fromTo('#s2-bank', { opacity: 0, x: 80, rotation: 0 }, { opacity: 1, x: 0, rotation: -1.6, duration: 0.8, ease: 'expo.out' }, 4.15);
tl.fromTo('#s2-erp', { opacity: 0, x: 80, rotation: 0 }, { opacity: 1, x: 0, rotation: 1.4, duration: 0.8, ease: 'expo.out' }, 4.4);
tl.to('#s2-pdf', { rotation: -1.2, duration: 0.8, ease: 'power2.out' }, 4.2);
// titles
revealWords(tl, '.s2-w1', 3.95);
revealWords(tl, '.s2-w2', 4.6);
revealWords(tl, '.s2-w3', 5.25, 0.06);
hideWords(tl, '.s2-w1, .s2-w2, .s2-w3', 6.62, 0.02);
// everything gathers into one workspace
tl.fromTo('#s2-ws', { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'power3.out' }, 6.65);
tl.to('#s2-bank', { x: 360 - 1290, y: 400 - 150, scale: 0.72, rotation: 0, duration: 0.75, ease: 'power3.inOut' }, 6.7);
tl.to('#s2-erp', { x: 1210 - 1290, y: 360 - 520, scale: 0.72, rotation: 0, duration: 0.75, ease: 'power3.inOut' }, 6.75);
tl.to('#s2-pdf', { x: 790 - 700, y: 330 - 150, scale: 0.62, rotation: 0, duration: 0.75, ease: 'power3.inOut' }, 6.72);
// follow the remittance
tl.to('#s2-ws, #s2-bank, #s2-erp', { opacity: 0, filter: 'blur(10px)', duration: 0.3, ease: 'power2.in' }, 7.55);
tl.to('#s2-pdf', { x: 0, y: 0, scale: 1, duration: 0.45, ease: 'power3.inOut' }, 7.55);

window.__timelines = window.__timelines || {};
window.__timelines["s2"] = tl;
})();
</script>
</template>
